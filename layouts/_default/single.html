{{ define "main" }}
<style>
  .post-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px;
    box-sizing: border-box;
  }
  
  .post-header {
    margin-bottom: 48px;
  }
  
  .post-title {
    font-family: 'Source Serif Pro', serif;
    font-size: 36px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #4a4b4f;
  }
  
  .post-date {
    color: #9d9d9d;
    font-style: italic;
    margin-bottom: 20px;
  }
  
  .post-description {
    font-style: italic;
    color: #666;
    margin-bottom: 30px;
    font-size: 18px;
  }
  
  .post-content {
    line-height: 1.8;
  }
  
  .post-content h2,
  .post-content h3,
  .post-content h4 {
    font-family: 'Source Serif Pro', serif;
    font-weight: 600;
    margin: 40px 0 20px 0;
    color: #4a4b4f;
  }

  .post-content h2 { font-size: 30px; }
  .post-content h3 { font-size: 24px; }
  .post-content h4 { font-size: 20px; }
  
  .post-content p {
    margin-bottom: 24px;
  }
  
  .post-content img {
    display: block;
    margin: 2rem auto;
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }
  
  /* Style for image captions (typically placed in an <em> tag after an image) */
  .post-content img + em {
    display: block;
    text-align: center;
    font-size: 0.9em;
    color: #777;
    margin-top: -0.75rem;
    margin-bottom: 2rem;
  }
  
  .post-content em {
    color: #666;
  }
  
  .back-link {
    display: inline-block;
    margin-top: 60px;
    margin-bottom: 30px;
    color: #8f6a60;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  
  .back-link:hover {
    color: #6b5046;
  }

  @media (max-width: 768px) {
    .post-container {
      padding: 0 20px;
    }

    .post-title {
      font-size: 28px;
    }

    .post-content h2 { font-size: 26px; }
    .post-content h3 { font-size: 22px; }
    .post-content h4 { font-size: 20px; }
  }
</style>

<div class="post-container">
  <div class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-date">{{ .Date.Format "January 2, 2006" }}</div>
    {{ if .Description }}
      <div class="post-description">{{ .Description }}</div>
    {{ end }}
  </div>
  
  <div class="post-content">
    {{ .Content }}
  </div>
  
  <a href="{{ "/" | relURL }}" class="back-link">← Back to home</a>
</div>
{{ end }}
